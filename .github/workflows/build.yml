name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Tasker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tasker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tasker.apk --title "Tasker latest build" --notes "build=${{ github.run_number }} commit=${{ github.sha }}"
